### 模型配置
model_name_or_path: /Users/bornfly/Desktop/SubjectiveEgoneticsAI/model_weights/Qwen3.5-0.8B
template: qwen
trust_remote_code: true

### 数据配置
dataset:
  - personal_knowledge
dataset_dir: data/datasets
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 1

train_on_prompt: false
mask_history: false

### 训练配置
output_dir: data/checkpoints/sft-qwen3.5-0.8b

finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03

### 优化配置
fp16: true
gradient_checkpointing: true

### 日志
logging_steps: 10
save_steps: 50
plot_loss: true
report_to: none

### 评估
eval_strategy: steps
eval_steps: 50
per_device_eval_batch_size: 1
val_size: 0.0
load_best_model_at_end: false
